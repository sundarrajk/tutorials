<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300">
  <style>
    .sender{fill:var(--svg-fill1,rgba(99,179,237,.2));stroke:var(--svg-blue,#63b3ed);stroke-width:1.4;}
    .mta{fill:var(--svg-fill1,rgba(246,173,85,.2));stroke:var(--svg-amber,#f6ad55);stroke-width:1.4;}
    .dns{fill:var(--svg-fill1,rgba(183,148,244,.2));stroke:var(--svg-purple,#b794f4);stroke-width:1.2;}
    .recv{fill:var(--svg-fill1,rgba(104,211,145,.2));stroke:var(--svg-green,#68d391);stroke-width:1.4;}
    .spam{fill:var(--svg-fill1,rgba(252,129,129,.2));stroke:var(--svg-red,#fc8181);stroke-width:1.4;}
    .arr{fill:var(--svg-text2,rgba(99,179,237,.55));}
    .con{stroke:var(--svg-text2,rgba(99,179,237,.45));fill:none;stroke-width:1.4;}
    .con-r{stroke:var(--svg-red,rgba(252,129,129,.6));fill:none;stroke-width:1.4;stroke-dasharray:5,3;}
    .hdr{fill:var(--svg-text2,rgba(99,179,237,.55));font-family:monospace;font-size:9.5px;letter-spacing:1px;font-weight:700;text-anchor:middle;}
    .lbl{fill:var(--svg-text1,#d0e4f8);font-family:monospace;font-size:8.5px;font-weight:700;text-anchor:middle;}
    .sub{fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:7.5px;text-anchor:middle;}
    .note{fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:8px;}
    .good{fill:var(--svg-green,rgba(104,211,145,.8));font-family:monospace;font-size:8px;}
    .warn{fill:var(--svg-red,rgba(252,129,129,.75));font-family:monospace;font-size:8px;}
    .step{fill:var(--svg-amber,rgba(246,173,85,.8));font-family:monospace;font-size:8px;font-weight:700;text-anchor:middle;}
    .cmd{fill:var(--svg-blue,#63b3ed);font-family:monospace;font-size:8px;}
  </style>
  <defs>
    <marker id="smtpA" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" class="arr"/></marker>
    <marker id="smtpR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="var(--svg-red,rgba(252,129,129,.6))"/></marker>
  </defs>

  <text x="410" y="14" class="hdr">SMTP EMAIL FLOW — alice@company-a.com → bob@company-b.com</text>

  <!-- Alice's mail client -->
  <rect x="6"   y="24" width="112" height="48" rx="6" class="sender"/>
  <text x="62"  y="40" class="lbl">ALICE</text>
  <text x="62"  y="51" class="sub">alice@company-a.com</text>
  <text x="62"  y="62" class="sub">Outlook / Gmail client</text>

  <line x1="118" y1="48" x2="148" y2="48" class="con" marker-end="url(#smtpA)"/>
  <text x="133" y="42" class="step">①</text>
  <text x="133" y="56" class="sub">SMTP:587</text>

  <!-- Company A MTA (Mail Transfer Agent) -->
  <rect x="150" y="20" width="140" height="56" rx="6" class="mta"/>
  <text x="220" y="37" class="lbl">COMPANY-A MTA</text>
  <text x="220" y="48" class="sub">Postfix / SendGrid</text>
  <text x="220" y="58" class="sub">mail.company-a.com</text>
  <text x="220" y="68" class="sub">Port 25 → outbound SMTP</text>

  <!-- DNS MX lookup -->
  <line x1="220" y1="76" x2="220" y2="116" class="con" marker-end="url(#smtpA)"/>
  <text x="232" y="92" class="step">②</text>
  <text x="232" y="104" class="sub">MX lookup</text>

  <rect x="156" y="118" width="126" height="38" rx="5" class="dns"/>
  <text x="219" y="133" class="lbl">DNS SERVER</text>
  <text x="219" y="144" class="sub">MX for company-b.com?</text>
  <text x="219" y="155" class="sub">→ mail.company-b.com (pri=10)</text>

  <line x1="220" y1="158" x2="220" y2="80" class="con" stroke="var(--svg-green,rgba(104,211,145,.5))" stroke-dasharray="4,3" fill="none" marker-end="url(#smtpA)"/>
  <text x="162" y="178" class="sub" fill="var(--svg-green,#68d391)">③ Returns: mail.company-b.com</text>

  <!-- MTA to MTA hop -->
  <line x1="292" y1="48" x2="390" y2="48" class="con" marker-end="url(#smtpA)"/>
  <text x="341" y="40" class="step">④</text>
  <text x="341" y="52" class="sub">SMTP Port 25</text>
  <text x="341" y="62" class="sub">STARTTLS encrypted</text>

  <!-- Company B MTA -->
  <rect x="392" y="20" width="160" height="80" rx="6" class="recv"/>
  <text x="472" y="38" class="lbl">COMPANY-B MTA</text>
  <text x="472" y="49" class="sub">mail.company-b.com</text>
  <text x="472" y="62" class="sub">Checks SPF: is company-a IP</text>
  <text x="472" y="73" class="sub">allowed to send for company-a.com?</text>
  <text x="472" y="84" class="sub">Checks DKIM: signature valid?</text>
  <text x="472" y="95" class="sub">Checks DMARC: policy pass?</text>

  <!-- Deliver to Bob -->
  <line x1="554" y1="60" x2="604" y2="60" class="con" marker-end="url(#smtpA)"/>
  <text x="579" y="52" class="step">⑤</text>
  <text x="579" y="64" class="sub">IMAP/POP3</text>

  <rect x="606" y="36" width="112" height="48" rx="6" class="recv"/>
  <text x="662" y="52" class="lbl">BOB</text>
  <text x="662" y="63" class="sub">bob@company-b.com</text>
  <text x="662" y="74" class="sub">Reads email ✓</text>

  <!-- Security features box -->
  <rect x="6" y="194" width="398" height="102" rx="7" fill="var(--svg-fill2,rgba(99,179,237,.05))" stroke="var(--svg-border,rgba(99,179,237,.18))" stroke-width="1"/>
  <text x="205" y="210" class="hdr">EMAIL AUTHENTICATION RECORDS (in DNS)</text>
  <text x="14"  y="227" class="good" font-weight="700">SPF</text>
  <text x="36"  y="227" class="note">TXT: "v=spf1 ip4:45.33.0.0/24 include:sendgrid.net ~all"</text>
  <text x="14"  y="240" class="note">   Lists which mail servers are authorised to send for this domain</text>
  <text x="14"  y="255" class="good" font-weight="700">DKIM</text>
  <text x="44"  y="255" class="note">Sending MTA signs email with private key. DNS holds public key.</text>
  <text x="14"  y="268" class="note">   Receiving MTA verifies signature → proves message not tampered</text>
  <text x="14"  y="283" class="good" font-weight="700">DMARC</text>
  <text x="50"  y="283" class="note">Policy: if SPF and DKIM both fail → reject/quarantine/report</text>
  <text x="14"  y="296" class="note">   "v=DMARC1; p=reject; rua=mailto:dmarc@company-a.com"</text>

  <!-- Blacklisting box -->
  <rect x="412" y="118" width="400" height="178" rx="7" fill="var(--svg-fill2,rgba(252,129,129,.05))" stroke="var(--svg-red,rgba(252,129,129,.2))" stroke-width="1"/>
  <text x="612" y="134" class="hdr" fill="var(--svg-red,#fc8181)">BLACKLISTING &amp; REPUTATION</text>
  <text x="420" y="152" class="warn" font-weight="700">How domains get blacklisted:</text>
  <text x="420" y="166" class="note">▸ Send mass emails → recipients mark as spam → complaint rate &gt;0.1%</text>
  <text x="420" y="179" class="note">▸ Spam trap hits: sending to long-dead addresses = known spammer signal</text>
  <text x="420" y="192" class="note">▸ High bounce rate: sending to invalid addresses</text>
  <text x="420" y="205" class="note">▸ Missing SPF / DKIM / DMARC = low trust score</text>
  <text x="420" y="218" class="note">▸ IP blacklists: Spamhaus ZEN, SORBS, Barracuda — checked by every MTA</text>
  <text x="420" y="234" class="good" font-weight="700">Google &amp; Yahoo 2024 requirements:</text>
  <text x="420" y="248" class="note">▸ DMARC required for bulk senders (&gt;5000 emails/day)</text>
  <text x="420" y="261" class="note">▸ Spam complaint rate &lt; 0.1% (or Google starts rejecting)</text>
  <text x="420" y="274" class="note">▸ Easy unsubscribe link required (one-click)</text>
  <text x="420" y="288" class="note">▸ Warmup: new domains must start with low volume and build reputation slowly</text>
</svg>
