<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420">
  <style>
    .internet{fill:var(--svg-fill2,rgba(99,179,237,.08));stroke:var(--svg-blue,rgba(99,179,237,.4));stroke-width:1.5;stroke-dasharray:6,4;}
    .router {fill:var(--svg-fill1,rgba(99,179,237,.2));stroke:var(--svg-blue,#63b3ed);stroke-width:1.4;}
    .fw    {fill:var(--svg-fill1,rgba(252,129,129,.25));stroke:var(--svg-red,#fc8181);stroke-width:1.6;}
    .waf   {fill:var(--svg-fill1,rgba(246,173,85,.22));stroke:var(--svg-amber,#f6ad55);stroke-width:1.4;}
    .lb    {fill:var(--svg-fill1,rgba(104,211,145,.22));stroke:var(--svg-green,#68d391);stroke-width:1.4;}
    .sw    {fill:var(--svg-fill1,rgba(183,148,244,.22));stroke:var(--svg-purple,#b794f4);stroke-width:1.4;}
    .srv   {fill:var(--svg-fill1,rgba(99,179,237,.15));stroke:var(--svg-blue,rgba(99,179,237,.5));stroke-width:1.2;}
    .db    {fill:var(--svg-fill1,rgba(246,173,85,.2));stroke:var(--svg-amber,rgba(246,173,85,.6));stroke-width:1.2;}
    .zone  {fill:var(--svg-fill2,rgba(99,179,237,.04));stroke:var(--svg-border,rgba(99,179,237,.12));stroke-width:.8;stroke-dasharray:5,3;}
    .arr   {fill:var(--svg-text2,rgba(99,179,237,.5));}
    .con   {stroke:var(--svg-text2,rgba(99,179,237,.45));fill:none;stroke-width:1.5;}
    .hdr   {fill:var(--svg-text2,rgba(99,179,237,.55));font-family:monospace;font-size:9px;letter-spacing:1px;font-weight:700;text-anchor:middle;}
    .lbl   {fill:var(--svg-text1,#d0e4f8);font-family:monospace;font-size:8px;font-weight:700;text-anchor:middle;}
    .sub   {fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:7px;text-anchor:middle;}
    .app   {fill:var(--svg-green,rgba(104,211,145,.8));font-family:monospace;font-size:7px;text-anchor:middle;}
    .note  {fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:8px;}
    .zone-l{fill:var(--svg-text2,rgba(99,179,237,.4));font-family:monospace;font-size:8px;font-weight:700;letter-spacing:1px;}
    [data-theme="light"] .lbl  { fill: #1a2a3a; }
    [data-theme="light"] .sub  { fill: #2a3a4a; }
    [data-theme="light"] .app  { fill: #1a4a2a; }
    [data-theme="light"] .note { fill: #2a3a4a; }
    [data-theme="light"] .zone-l { fill: #2a4a6a; }
  </style>
  <defs>
    <marker id="dcA" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" class="arr"/>
    </marker>
  </defs>

  <!-- Internet cloud -->
  <ellipse cx="90" cy="60" rx="82" ry="40" class="internet"/>
  <text x="90" y="55" class="hdr">INTERNET</text>
  <text x="90" y="67" class="sub">Users worldwide</text>
  <text x="90" y="79" class="sub">ISPs · BGP routes</text>

  <!-- Edge Router -->
  <line x1="172" y1="60" x2="214" y2="60" class="con" marker-end="url(#dcA)"/>
  <rect x="216" y="44" width="90" height="32" rx="6" class="router"/>
  <text x="261" y="58" class="lbl">BORDER ROUTER</text>
  <text x="261" y="68" class="sub">BGP · 100Gbps · DDoS scrubbing</text>

  <!-- Outer Firewall -->
  <line x1="306" y1="60" x2="344" y2="60" class="con" marker-end="url(#dcA)"/>
  <rect x="346" y="40" width="90" height="40" rx="6" class="fw"/>
  <text x="391" y="55" class="lbl">🔥 FIREWALL</text>
  <text x="391" y="65" class="sub">Stateful · Block bad IPs</text>
  <text x="391" y="75" class="sub">pf / iptables / Palo Alto</text>

  <!-- WAF -->
  <line x1="436" y1="60" x2="474" y2="60" class="con" marker-end="url(#dcA)"/>
  <rect x="476" y="40" width="100" height="40" rx="6" class="waf"/>
  <text x="526" y="55" class="lbl">🛡 WAF</text>
  <text x="526" y="65" class="sub">Web App Firewall</text>
  <text x="526" y="75" class="sub">SQLi · XSS · OWASP Top10</text>

  <!-- L7 Load Balancer -->
  <line x1="576" y1="60" x2="614" y2="60" class="con" marker-end="url(#dcA)"/>
  <rect x="616" y="40" width="110" height="40" rx="6" class="lb"/>
  <text x="671" y="55" class="lbl">⚖ L7 LOAD BALANCER</text>
  <text x="671" y="65" class="sub">nginx / HAProxy / AWS ALB</text>
  <text x="671" y="75" class="sub">SSL termination · URL routing</text>

  <!-- DMZ zone label -->
  <rect x="208" y="26" width="528" height="60" rx="8" class="zone"/>
  <text x="216" y="22" class="zone-l">DMZ / PERIMETER ZONE</text>

  <!-- ─── INTERNAL SWITCHES ─── -->
  <line x1="671" y1="80" x2="671" y2="110" class="con" marker-end="url(#dcA)"/>
  <!-- Core switch -->
  <rect x="610" y="112" width="122" height="28" rx="5" class="sw"/>
  <text x="671" y="124" class="lbl">CORE SWITCH (L3)</text>
  <text x="671" y="134" class="sub">10Gbps trunks · VLANs · OSPF</text>

  <!-- Branch to multiple ToR switches -->
  <line x1="671" y1="140" x2="671" y2="160" class="con" marker-end="url(#dcA)"/>
  <!-- ToR Switch for Web Tier -->
  <line x1="671" y1="160" x2="300" y2="175" class="con" marker-end="url(#dcA)"/>
  <line x1="671" y1="160" x2="671" y2="175" class="con" marker-end="url(#dcA)"/>
  <line x1="671" y1="160" x2="800" y2="175" class="con" marker-end="url(#dcA)"/>

  <rect x="160" y="176" width="100" height="26" rx="5" class="sw"/>
  <text x="210" y="187" class="lbl">ToR SWITCH</text>
  <text x="210" y="197" class="sub">Web Tier VLAN 10</text>

  <rect x="610" y="176" width="122" height="26" rx="5" class="sw"/>
  <text x="671" y="187" class="lbl">ToR SWITCH</text>
  <text x="671" y="197" class="sub">App Tier VLAN 20</text>

  <rect x="750" y="176" width="102" height="26" rx="5" class="sw"/>
  <text x="801" y="187" class="lbl">ToR SWITCH</text>
  <text x="801" y="197" class="sub">DB Tier VLAN 30</text>

  <!-- Web Servers -->
  <line x1="210" y1="202" x2="115" y2="220" class="con" marker-end="url(#dcA)"/>
  <line x1="210" y1="202" x2="227" y2="220" class="con" marker-end="url(#dcA)"/>
  <line x1="210" y1="202" x2="339" y2="220" class="con" marker-end="url(#dcA)"/>

  <rect x="62"  y="222" width="106" height="50" rx="5" class="srv"/>
  <text x="115" y="238" class="lbl">WEB SERVER 1</text>
  <text x="115" y="250" class="app">nginx · static assets</text>
  <text x="115" y="262" class="app">React SPA · CDN cache</text>

  <rect x="174" y="222" width="106" height="50" rx="5" class="srv"/>
  <text x="227" y="238" class="lbl">WEB SERVER 2</text>
  <text x="227" y="250" class="app">nginx · same role</text>
  <text x="227" y="262" class="app">Horizontal scale</text>

  <rect x="286" y="222" width="106" height="50" rx="5" class="srv"/>
  <text x="339" y="238" class="lbl">WEB SERVER 3</text>
  <text x="339" y="250" class="app">nginx + Let's Encrypt</text>
  <text x="339" y="262" class="app">TLS already terminated</text>

  <!-- App Servers -->
  <line x1="671" y1="202" x2="581" y2="220" class="con" marker-end="url(#dcA)"/>
  <line x1="671" y1="202" x2="697" y2="220" class="con" marker-end="url(#dcA)"/>
  <line x1="671" y1="202" x2="808" y2="220" class="con" marker-end="url(#dcA)"/>

  <rect x="526" y="222" width="110" height="50" rx="5" class="srv"/>
  <text x="581" y="238" class="lbl">APP SERVER 1</text>
  <text x="581" y="250" class="app">Spring Boot / Node.js</text>
  <text x="581" y="262" class="app">REST API · Business logic</text>

  <rect x="642" y="222" width="110" height="50" rx="5" class="srv"/>
  <text x="697" y="238" class="lbl">APP SERVER 2</text>
  <text x="697" y="250" class="app">Python Django</text>
  <text x="697" y="262" class="app">Payments service</text>

  <rect x="758" y="222" width="100" height="50" rx="5" class="srv"/>
  <text x="808" y="238" class="lbl">APP SERVER 3</text>
  <text x="808" y="250" class="app">Go microservice</text>
  <text x="808" y="262" class="app">Auth / sessions</text>

  <!-- DB Servers -->
  <line x1="801" y1="202" x2="801" y2="222" class="con" marker-end="url(#dcA)"/>

  <rect x="744" y="288" width="118" height="44" rx="5" class="db"/>
  <text x="803" y="303" class="lbl">PRIMARY DB</text>
  <text x="803" y="314" class="app">PostgreSQL · MySQL</text>
  <text x="803" y="325" class="app">Read+Write master</text>

  <!-- Internal Firewall between tiers -->
  <rect x="384" y="288" width="120" height="46" rx="5" class="fw"/>
  <text x="444" y="302" class="lbl">🔥 INTERNAL FW</text>
  <text x="444" y="314" class="sub">East-West security</text>
  <text x="444" y="322" class="sub">App→DB: port 5432 only</text>

  <!-- Zone rectangles -->
  <rect x="56" y="212" width="346" height="68" rx="6" class="zone"/>
  <text x="68" y="212" class="zone-l">WEB TIER — VLAN 10</text>
  <rect x="520" y="212" width="342" height="68" rx="6" class="zone"/>
  <text x="532" y="212" class="zone-l">APP TIER — VLAN 20</text>
  <rect x="738" y="278" width="130" height="64" rx="6" class="zone"/>
  <text x="746" y="276" class="zone-l">DB TIER — VLAN 30</text>

  <!-- App to DB arrows -->
  <line x1="697" y1="272" x2="803" y2="286" stroke="var(--svg-amber,rgba(246,173,85,.5))" stroke-width="1.2" fill="none" marker-end="url(#dcA)"/>
  <line x1="581" y1="272" x2="803" y2="286" stroke="var(--svg-amber,rgba(246,173,85,.5))" stroke-width="1.2" fill="none" marker-end="url(#dcA)"/>

  <!-- Legend / notes -->
  <rect x="10" y="348" width="500" height="68" rx="6" fill="var(--svg-fill2,rgba(99,179,237,.04))" stroke="var(--svg-border,rgba(99,179,237,.12))" stroke-width=".8"/>
  <text x="18" y="364" class="note" font-weight="700" fill="var(--svg-blue,#63b3ed)">Traffic path:</text>
  <text x="82" y="364" class="note">Internet → Border Router (BGP) → Outer Firewall (stateful) → WAF (HTTP inspection)</text>
  <text x="18" y="378" class="note">→ L7 LB (SSL termination, URL routing) → Core Switch (L3, VLANs) → ToR Switches</text>
  <text x="18" y="392" class="note">→ Web Tier (nginx) → App Tier (business logic) → Internal FW → DB Tier (database)</text>
  <text x="18" y="406" class="note">VLANs enforce layer-2 isolation between tiers. Internal firewall enforces layer-3/4 policy between app→db.</text>

  <rect x="520" y="348" width="330" height="68" rx="6" fill="var(--svg-fill2,rgba(252,129,129,.04))" stroke="var(--svg-red,rgba(252,129,129,.15))" stroke-width=".8"/>
  <text x="528" y="364" class="note" font-weight="700" fill="var(--svg-red,#fc8181)">Security layers:</text>
  <text x="528" y="378" class="note">1. DDoS scrubbing at border  2. Stateful FW at perimeter</text>
  <text x="528" y="392" class="note">3. WAF for OWASP Top 10  4. VLANs for tier isolation</text>
  <text x="528" y="406" class="note">5. Internal FW: principle of least privilege (app→DB only port 5432)</text>
</svg>
