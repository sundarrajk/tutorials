<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <style>
    .origin{fill:var(--svg-fill1,rgba(99,179,237,.22));stroke:var(--svg-blue,#63b3ed);stroke-width:1.6;}
    .cdn   {fill:var(--svg-fill1,rgba(183,148,244,.18));stroke:var(--svg-purple,#b794f4);stroke-width:1.4;}
    .edge  {fill:var(--svg-fill1,rgba(104,211,145,.22));stroke:var(--svg-green,#68d391);stroke-width:1.6;}
    .user  {fill:var(--svg-fill1,rgba(246,173,85,.18));stroke:var(--svg-amber,#f6ad55);stroke-width:1.2;}
    .con-s {stroke:var(--svg-red,rgba(252,129,129,.5));fill:none;stroke-width:1.2;stroke-dasharray:5,3;}
    .con-f {stroke:var(--svg-green,rgba(104,211,145,.6));fill:none;stroke-width:2;}
    .con   {stroke:var(--svg-text2,rgba(99,179,237,.4));fill:none;stroke-width:1.3;}
    .arr-s {fill:var(--svg-red,rgba(252,129,129,.6));}
    .arr-f {fill:var(--svg-green,rgba(104,211,145,.6));}
    .arr   {fill:var(--svg-text2,rgba(99,179,237,.55));}
    .hdr   {fill:var(--svg-text2,rgba(99,179,237,.55));font-family:monospace;font-size:9.5px;letter-spacing:1px;font-weight:700;text-anchor:middle;}
    .lbl   {fill:var(--svg-text1,#d0e4f8);font-family:monospace;font-size:8.5px;font-weight:700;text-anchor:middle;}
    .sub   {fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:7.5px;text-anchor:middle;}
    .note  {fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:8px;}
    .good  {fill:var(--svg-green,rgba(104,211,145,.8));font-family:monospace;font-size:8px;}
    .warn  {fill:var(--svg-red,rgba(252,129,129,.75));font-family:monospace;font-size:8px;}
    .ms-s  {fill:var(--svg-red,rgba(252,129,129,.8));font-family:monospace;font-size:8.5px;font-weight:700;text-anchor:middle;}
    .ms-f  {fill:var(--svg-green,rgba(104,211,145,.8));font-family:monospace;font-size:8.5px;font-weight:700;text-anchor:middle;}
    .app   {fill:var(--svg-green,rgba(104,211,145,.85));font-family:monospace;font-size:7.5px;text-anchor:middle;}
    @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
    .pls1{animation:pulse 2s 0.0s infinite;}
    .pls2{animation:pulse 2s 0.5s infinite;}
    .pls3{animation:pulse 2s 1.0s infinite;}
    .pls4{animation:pulse 2s 1.5s infinite;}
  </style>
  <defs>
    <marker id="cdnS" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" class="arr-s"/></marker>
    <marker id="cdnF" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" class="arr-f"/></marker>
    <marker id="cdnN" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" class="arr"/></marker>
  </defs>

  <!-- Origin Server -->
  <rect x="310" y="6"  width="200" height="64" rx="7" class="origin"/>
  <text x="410" y="24" class="lbl">🏠 ORIGIN SERVER</text>
  <text x="410" y="37" class="sub">InsuranceCo HQ — Virginia, USA</text>
  <text x="410" y="50" class="sub">All content + business logic</text>
  <text x="410" y="62" class="sub">Latency to India: ~200ms</text>

  <!-- Phase 1 header -->
  <text x="410" y="86" class="hdr">PHASE 1 — CDN: CACHE CONTENT NEAR USERS</text>

  <!-- User India -->
  <rect x="6"  y="98" width="110" height="40" rx="5" class="user"/>
  <text x="61" y="114" class="lbl">User — Mumbai</text>
  <text x="61" y="128" class="sub">192.168.1.5</text>

  <!-- CDN PoPs — 4 boxes spread across -->
  <rect x="128" y="96" width="116" height="52" rx="6" class="cdn pls1"/>
  <text x="186" y="113" class="lbl">CDN PoP</text>
  <text x="186" y="125" class="sub">Mumbai, India</text>
  <text x="186" y="137" class="sub">HTML/CSS/JS/images</text>

  <rect x="256" y="96" width="116" height="52" rx="6" class="cdn pls2"/>
  <text x="314" y="113" class="lbl">CDN PoP</text>
  <text x="314" y="125" class="sub">Singapore</text>
  <text x="314" y="137" class="sub">~5ms to SG users</text>

  <rect x="510" y="96" width="116" height="52" rx="6" class="cdn pls3"/>
  <text x="568" y="113" class="lbl">CDN PoP</text>
  <text x="568" y="125" class="sub">London, UK</text>
  <text x="568" y="137" class="sub">~2ms to UK users</text>

  <rect x="638" y="96" width="118" height="52" rx="6" class="cdn pls4"/>
  <text x="697" y="113" class="lbl">CDN PoP</text>
  <text x="697" y="125" class="sub">São Paulo, Brazil</text>
  <text x="697" y="137" class="sub">~3ms to BR users</text>

  <!-- Without CDN: slow red arrow -->
  <line x1="61"  y1="98" x2="309" y2="36" class="con-s" marker-end="url(#cdnS)"/>
  <text x="170"  y="56" class="ms-s">200ms round trip (no CDN)</text>

  <!-- With CDN: fast green arrow -->
  <line x1="61"  y1="128" x2="126" y2="120" class="con-f" marker-end="url(#cdnF)"/>
  <text x="82"   y="152" class="ms-f">~5ms !</text>

  <!-- CDN cache miss → origin -->
  <line x1="244" y1="120" x2="308" y2="38" class="con" stroke-dasharray="4,3" marker-end="url(#cdnN)"/>
  <text x="272"  y="72"  class="sub">cache miss → origin</text>

  <!-- Phase 2 header -->
  <text x="410" y="170" class="hdr">PHASE 2 — EDGE COMPUTING: RUN CODE AT THE PoP</text>
  <text x="410" y="184" class="sub">Same PoPs now execute serverless functions — not just serve cached files</text>

  <!-- Edge node box — given plenty of room -->
  <rect x="6" y="194" width="248" height="158" rx="7" class="edge"/>
  <text x="130" y="213" class="lbl">🟢 EDGE NODE — MUMBAI</text>
  <text x="130" y="225" class="sub">Cloudflare Workers · Lambda@Edge · Fastly Compute</text>
  <line x1="14" y1="230" x2="246" y2="230" stroke="var(--svg-green,rgba(104,211,145,.2))" stroke-width=".7" fill="none"/>
  <rect x="14"  y="236" width="106" height="22" rx="3" fill="var(--svg-fill2,rgba(104,211,145,.15))" stroke="var(--svg-green,rgba(104,211,145,.4))" stroke-width=".8"/>
  <text x="67"  y="251" class="app">Premium Calculator</text>
  <rect x="128" y="236" width="114" height="22" rx="3" fill="var(--svg-fill2,rgba(104,211,145,.15))" stroke="var(--svg-green,rgba(104,211,145,.4))" stroke-width=".8"/>
  <text x="185" y="251" class="app">Auth JWT verify</text>
  <rect x="14"  y="262" width="106" height="22" rx="3" fill="var(--svg-fill2,rgba(104,211,145,.15))" stroke="var(--svg-green,rgba(104,211,145,.4))" stroke-width=".8"/>
  <text x="67"  y="277" class="app">A/B test routing</text>
  <rect x="128" y="262" width="114" height="22" rx="3" fill="var(--svg-fill2,rgba(104,211,145,.15))" stroke="var(--svg-green,rgba(104,211,145,.4))" stroke-width=".8"/>
  <text x="185" y="277" class="app">Geo-IP redirect</text>
  <rect x="14"  y="288" width="106" height="22" rx="3" fill="var(--svg-fill2,rgba(104,211,145,.15))" stroke="var(--svg-green,rgba(104,211,145,.4))" stroke-width=".8"/>
  <text x="67"  y="303" class="app">Bot detection</text>
  <rect x="128" y="288" width="114" height="22" rx="3" fill="var(--svg-fill2,rgba(104,211,145,.15))" stroke="var(--svg-green,rgba(104,211,145,.4))" stroke-width=".8"/>
  <text x="185" y="303" class="app">Rate limiting</text>
  <text x="130" y="344" class="sub">Result in &lt;10ms — origin never called</text>

  <!-- Insurance example -->
  <rect x="262" y="194" width="292" height="158" rx="7" fill="var(--svg-fill2,rgba(246,173,85,.07))" stroke="var(--svg-amber,rgba(246,173,85,.3))" stroke-width="1.2"/>
  <text x="408" y="213" class="hdr" fill="var(--svg-amber,#f6ad55)">🏥 INSURANCE PREMIUM CALCULATOR</text>
  <text x="270" y="232" class="note">Without edge: User in Mumbai clicks "Get Quote"</text>
  <text x="270" y="247" class="warn">→ 200ms to Virginia + compute + 200ms back</text>
  <text x="270" y="261" class="warn">= 400ms+ per keypress → slow, poor UX</text>
  <text x="270" y="281" class="note">With Cloudflare Worker in Mumbai:</text>
  <text x="270" y="295" class="good">→ Age/health inputs → rate table → result in &lt;10ms</text>
  <text x="270" y="309" class="good">→ Real-time quote as user types. No spinner.</text>
  <text x="270" y="323" class="good">→ Only complex underwriting hits the origin.</text>
  <text x="270" y="342" class="note">Platforms: Cloudflare Workers · AWS Lambda@Edge</text>
  <text x="270" y="354" class="note">Fastly Compute@Edge · Vercel Edge Functions</text>

  <!-- More examples -->
  <rect x="562" y="194" width="252" height="158" rx="7" fill="var(--svg-fill2,rgba(104,211,145,.05))" stroke="var(--svg-green,rgba(104,211,145,.22))" stroke-width="1"/>
  <text x="688" y="213" class="hdr" fill="var(--svg-green,#68d391)">MORE EDGE USE CASES</text>
  <text x="570" y="234" class="good">▸ E-commerce</text>
  <text x="570" y="248" class="note">  Personalised homepage at edge</text>
  <text x="570" y="266" class="good">▸ Media / Streaming</text>
  <text x="570" y="280" class="note">  Video transcoding near viewer</text>
  <text x="570" y="298" class="good">▸ Online Gaming</text>
  <text x="570" y="312" class="note">  Matchmaking at nearest PoP</text>
  <text x="570" y="330" class="good">▸ Healthcare</text>
  <text x="570" y="344" class="note">  Triage chatbot — offline capable</text>

  <!-- Bottom comparison -->
  <rect x="6" y="362" width="808" height="110" rx="7" fill="var(--svg-fill2,rgba(99,179,237,.04))" stroke="var(--svg-border,rgba(99,179,237,.12))" stroke-width=".8"/>
  <text x="410" y="380" class="hdr">CDN vs EDGE COMPUTING — KEY DIFFERENCE</text>
  <text x="14"  y="398" class="note" font-weight="700" fill="var(--svg-purple,#b794f4)">CDN (Phase 1):</text>
  <text x="96"  y="398" class="note">Caches STATIC content (HTML, CSS, images, video) at PoPs. No code runs. Cache hit = fast. Cache miss = fetches from origin.</text>
  <text x="14"  y="414" class="note" font-weight="700" fill="var(--svg-green,#68d391)">Edge Computing (Phase 2):</text>
  <text x="136" y="414" class="note">Runs YOUR CODE (JavaScript, Rust, Go) at every PoP. Dynamic responses. No origin round-trip for most requests.</text>
  <text x="14"  y="430" class="note" font-weight="700" fill="var(--svg-amber,#f6ad55)">When to use edge:</text>
  <text x="100" y="430" class="note">Response must be dynamic but can be computed from data available at edge (JWT auth, rate limiting, personalisation, calculators).</text>
  <text x="14"  y="448" class="note" font-weight="700" fill="var(--svg-blue,#63b3ed)">When to use origin:</text>
  <text x="96"  y="448" class="note">Requires database queries, complex business logic, or data only the backend has (complex underwriting, fraud scoring, ML inference).</text>
  <text x="14"  y="466" class="note">Hybrid: edge handles 95% of requests (auth, cache, calculator); 5% complex queries go to origin — reduces origin load by 20×.</text>
</svg>
