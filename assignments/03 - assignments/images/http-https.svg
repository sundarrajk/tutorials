<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330">
  <style>
    .client{fill:var(--svg-fill1,rgba(99,179,237,.2));stroke:var(--svg-blue,#63b3ed);stroke-width:1.4;}
    .server{fill:var(--svg-fill1,rgba(104,211,145,.2));stroke:var(--svg-green,#68d391);stroke-width:1.4;}
    .bad   {fill:var(--svg-fill1,rgba(252,129,129,.2));stroke:var(--svg-red,#fc8181);stroke-width:1.4;}
    .eve   {fill:var(--svg-fill1,rgba(246,173,85,.2));stroke:var(--svg-amber,#f6ad55);stroke-width:1.4;}
    .cert  {fill:var(--svg-fill1,rgba(183,148,244,.2));stroke:var(--svg-purple,#b794f4);stroke-width:1.2;}
    .lbl{fill:var(--svg-text1,#d0e4f8);font-family:monospace;font-size:8.5px;font-weight:700;text-anchor:middle;}
    .sub{fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:7.5px;text-anchor:middle;}
    .q{fill:var(--svg-blue,#63b3ed);font-family:monospace;font-size:8px;text-anchor:middle;font-weight:700;}
    .r{fill:var(--svg-green,#68d391);font-family:monospace;font-size:8px;text-anchor:middle;font-weight:700;}
    .bad-t{fill:var(--svg-red,#fc8181);font-family:monospace;font-size:8px;text-anchor:middle;font-weight:700;}
    .note{fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:8px;}
    .good{fill:var(--svg-green,rgba(104,211,145,.8));font-family:monospace;font-size:8px;}
    .warn{fill:var(--svg-red,rgba(252,129,129,.75));font-family:monospace;font-size:8px;}
    .hdr{fill:var(--svg-text2,rgba(99,179,237,.55));font-family:monospace;font-size:9.5px;letter-spacing:1px;font-weight:700;text-anchor:middle;}
    .divl{stroke:var(--svg-text2,rgba(99,179,237,.18));fill:none;stroke-dasharray:5,4;}
    .enc{fill:rgba(104,211,145,.12);stroke:var(--svg-green,rgba(104,211,145,.4));stroke-width:1;stroke-dasharray:4,3;}
    .arr-b{fill:var(--svg-blue,rgba(99,179,237,.6));}
    .arr-g{fill:var(--svg-green,rgba(104,211,145,.6));}
    .arr-r{fill:var(--svg-red,rgba(252,129,129,.6));}
    .plain{stroke:var(--svg-red,rgba(252,129,129,.5));fill:none;stroke-width:1.5;}
    .sec  {stroke:var(--svg-green,rgba(104,211,145,.6));fill:none;stroke-width:1.5;}
  </style>
  <defs>
    <marker id="hA" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" class="arr-b"/></marker>
    <marker id="hG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" class="arr-g"/></marker>
    <marker id="hR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" class="arr-r"/></marker>
  </defs>

  <!-- ─── LEFT: HTTP (plain) ─── -->
  <text x="190" y="14" class="hdr">HTTP — PLAIN TEXT (PORT 80)</text>
  <rect x="10"  y="22" width="100" height="32" rx="5" class="client"/>
  <text x="60"  y="38" class="lbl">BROWSER</text>
  <text x="60"  y="49" class="sub">your-pc</text>
  <rect x="50"  y="110" width="80"  height="28" rx="5" class="eve"/>
  <text x="90"  y="123" class="lbl">🕵 EVE</text>
  <text x="90"  y="135" class="sub">Attacker on network</text>
  <rect x="270" y="22" width="100" height="32" rx="5" class="server"/>
  <text x="320" y="38" class="lbl">SERVER</text>
  <text x="320" y="49" class="sub">example.com</text>

  <!-- HTTP: plaintext GET visible -->
  <line x1="112" y1="55" x2="268" y2="55" class="plain" marker-end="url(#hA)"/>
  <text x="190" y="50" class="bad-t">GET /login HTTP/1.1</text>
  <text x="190" y="62" class="bad-t">Password: secret123  ← IN PLAIN TEXT</text>
  <!-- Eve intercepts -->
  <line x1="190" y1="64" x2="90"  y2="108" stroke="var(--svg-red,rgba(252,129,129,.5))" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#hR)"/>
  <text x="130" y="90" class="bad-t">reads everything!</text>

  <rect x="10" y="150" width="360" height="44" rx="5" fill="var(--svg-fill2,rgba(252,129,129,.06))" stroke="var(--svg-red,rgba(252,129,129,.25))" stroke-width="1"/>
  <text x="18" y="167" class="warn">✗ No encryption — entire request readable by anyone on the network</text>
  <text x="18" y="181" class="warn">✗ No server authentication — could be connecting to an impostor</text>
  <text x="18" y="192" class="warn">✗ Chrome/Firefox show "Not Secure" warning · Google penalises in SEO</text>

  <line x1="380" y1="10" x2="380" y2="330" class="divl"/>

  <!-- ─── RIGHT: HTTPS / TLS ─── -->
  <text x="600" y="14" class="hdr">HTTPS — TLS ENCRYPTED (PORT 443)</text>
  <rect x="390" y="22" width="100" height="32" rx="5" class="client"/>
  <text x="440" y="38" class="lbl">BROWSER</text>
  <text x="440" y="49" class="sub">your-pc</text>
  <rect x="710" y="22" width="100" height="32" rx="5" class="server"/>
  <text x="760" y="38" class="lbl">SERVER</text>
  <text x="760" y="49" class="sub">example.com</text>

  <!-- TLS Handshake steps -->
  <line x1="492" y1="64" x2="708" y2="78" class="sec" marker-end="url(#hA)"/>
  <text x="600" y="59" class="q">① ClientHello (TLS version, cipher suites, random)</text>

  <line x1="708" y1="82" x2="492" y2="98" class="sec" marker-end="url(#hG)"/>
  <text x="600" y="82" class="r">② ServerHello + Certificate (public key)</text>

  <!-- Cert verification -->
  <rect x="395" y="100" width="200" height="38" rx="4" class="cert"/>
  <text x="495" y="115" class="lbl">🔐 Verify Certificate</text>
  <text x="495" y="129" class="sub">Check CA signature · Not expired · Matches domain</text>

  <line x1="596" y1="116" x2="708" y2="128" class="sec" marker-end="url(#hA)"/>
  <text x="600" y="122" class="q">③ Pre-master secret (encrypted with server pub key)</text>

  <line x1="708" y1="132" x2="492" y2="144" class="sec" marker-end="url(#hG)"/>
  <text x="600" y="138" class="r">④ Finished (both sides derive session key)</text>

  <!-- Encrypted data -->
  <rect x="396" y="148" width="414" height="22" rx="4" class="enc"/>
  <line x1="492" y1="156" x2="708" y2="162" stroke="var(--svg-green,rgba(104,211,145,.8))" stroke-width="2" fill="none" marker-end="url(#hA)"/>
  <text x="600" y="155" class="r" font-size="9">⑤ ENCRYPTED: GET /login · Password: secret123</text>
  <line x1="708" y1="166" x2="492" y2="174" stroke="var(--svg-green,rgba(104,211,145,.8))" stroke-width="2" fill="none" marker-end="url(#hG)"/>
  <text x="600" y="170" class="r" font-size="9">⑥ ENCRYPTED: HTTP 200 OK · Set-Cookie: session=...</text>

  <!-- Encrypted zone label -->
  <rect x="396" y="178" width="414" height="14" rx="3" fill="var(--svg-fill2,rgba(104,211,145,.08))" stroke="none"/>
  <text x="603" y="189" class="good" text-anchor="middle">🔒 All data encrypted with AES-256 — unreadable to anyone intercepting</text>

  <rect x="390" y="200" width="420" height="60" rx="5" fill="var(--svg-fill2,rgba(104,211,145,.05))" stroke="var(--svg-green,rgba(104,211,145,.2))" stroke-width="1"/>
  <text x="600" y="216" class="good">✓ Encryption (AES-256) — data unreadable in transit</text>
  <text x="600" y="229" class="good">✓ Authentication — certificate proves server identity (signed by trusted CA)</text>
  <text x="600" y="242" class="good">✓ Integrity — MAC prevents tampering without detection</text>
  <text x="600" y="255" class="note">TLS 1.3 (2018): 1-RTT or 0-RTT handshake — faster than TLS 1.2</text>

  <!-- DNS + HTTPS together -->
  <rect x="10"  y="200" width="360" height="126" rx="7" fill="var(--svg-fill2,rgba(99,179,237,.05))" stroke="var(--svg-border,rgba(99,179,237,.15))" stroke-width="1"/>
  <text x="190" y="218" class="hdr" fill="var(--svg-blue,#63b3ed)">HTTPS + DNS — FULL FLOW</text>
  <text x="18"  y="234" class="note">1. User types: https://example.com</text>
  <text x="18"  y="248" class="note">2. OS DNS cache miss → recursive resolver → root → TLD → auth NS</text>
  <text x="18"  y="261" class="note">3. Resolver returns: example.com = 93.184.216.34 (A record)</text>
  <text x="18"  y="274" class="note">4. Browser opens TCP socket to 93.184.216.34:443</text>
  <text x="18"  y="287" class="note">5. TLS handshake (ClientHello → Certificate → Key exchange)</text>
  <text x="18"  y="300" class="note">6. HTTPS GET /  over encrypted channel</text>
  <text x="18"  y="313" class="note">7. Server sends HTML — browser renders page</text>
  <text x="18"  y="325" class="note">Total: ~150–300ms from key press to first byte received</text>
</svg>
