<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" style="transform: scale(1); transform-origin: left top 0px; display: block;">
  <style>
    .reg {fill:var(--svg-fill1,rgba(246,173,85,.2));stroke:var(--svg-amber,#f6ad55);stroke-width:1.4;}
    .tld {fill:var(--svg-fill1,rgba(183,148,244,.2));stroke:var(--svg-purple,#b794f4);stroke-width:1.4;}
    .ns  {fill:var(--svg-fill1,rgba(99,179,237,.2));stroke:var(--svg-blue,#63b3ed);stroke-width:1.4;}
    .web {fill:var(--svg-fill1,rgba(104,211,145,.2));stroke:var(--svg-green,#68d391);stroke-width:1.4;}
    .mail{fill:var(--svg-fill1,rgba(252,129,129,.2));stroke:var(--svg-red,#fc8181);stroke-width:1.4;}
    .arr  {fill:var(--svg-text2,rgba(99,179,237,.55));}
    .arr-g{fill:var(--svg-green,rgba(104,211,145,.6));}
    .arr-r{fill:var(--svg-red,rgba(252,129,129,.6));}
    .con  {stroke:var(--svg-text2,rgba(99,179,237,.45));fill:none;stroke-width:1.4;}
    .con-g{stroke:var(--svg-green,rgba(104,211,145,.5));fill:none;stroke-width:1.4;}
    .con-r{stroke:var(--svg-red,rgba(252,129,129,.5));fill:none;stroke-width:1.4;}
    .hdr {fill:var(--svg-text2,rgba(99,179,237,.55));font-family:monospace;font-size:9.5px;letter-spacing:1px;font-weight:700;text-anchor:middle;}
    .lbl {fill:var(--svg-text1,#d0e4f8);font-family:monospace;font-size:8.5px;font-weight:700;text-anchor:middle;}
    .sub {fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:7.5px;text-anchor:middle;}
    .sub1 {fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:7.5px;}
    .note{fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:8px;}
    .good{fill:var(--svg-green,rgba(104,211,145,.8));font-family:monospace;font-size:8px;}
    .num {fill:var(--svg-amber,#f6ad55);font-family:monospace;font-size:12px;font-weight:700;text-anchor:middle;}
    .rec  {fill:var(--svg-blue,#63b3ed);font-family:monospace;font-size:8px;font-weight:700;}
    .rec-g{fill:var(--svg-green,#68d391);font-family:monospace;font-size:8px;font-weight:700;}
    .rec-r{fill:var(--svg-red,#fc8181);font-family:monospace;font-size:8px;font-weight:700;}
  </style>
  <defs>
    <marker id="drA" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
  <path d="M0,0 L0,7 L7,3.5 z" class="arr"/>
  </marker>
    <marker id="drG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
  <path d="M0,0 L0,7 L7,3.5 z" class="arr-g"/>
  </marker>
    <marker id="drR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
  <path d="M0,0 L0,7 L7,3.5 z" class="arr-r"/>
  </marker>
  </defs>

  <text x="410" y="14" class="hdr" style="cursor: move;">DOMAIN REGISTRATION → DNS → WEB → EMAIL FLOW</text>

  <!-- Step 1: Registrar -->
  <text x="90" y="30" class="num" style="cursor: move;">1</text>
  <rect x="6" y="36" width="172" height="90" rx="7" class="reg" style="cursor: move;"/>
  <text x="92" y="54" class="lbl" style="cursor: move;">DOMAIN REGISTRAR</text>
  <text x="92" y="67" class="sub" style="cursor: move;">GoDaddy · Namecheap</text>
  <text x="92" y="79" class="sub" style="cursor: move;">Google Domains · Route 53</text>
  <text x="92" y="93" class="sub" style="cursor: move;">Pay ~$10–15/yr for</text>
  <text x="92" y="106" class="sub" style="cursor: move;">mycompany.com</text>
  <text x="92" y="118" class="sub" style="cursor: move;">Sets your NS records</text>

  <line x1="180" y1="82" x2="208" y2="82" class="con" marker-end="url(#drA)" style="cursor: move;"/>

  <!-- Step 2: TLD Registry -->
  <text x="294" y="30" class="num" style="cursor: move;">2</text>
  <rect x="210" y="36" width="166" height="90" rx="7" class="tld" style="cursor: move;"/>
  <text x="293" y="54" class="lbl" style="cursor: move;">TLD REGISTRY (.com)</text>
  <text x="293" y="67" class="sub" style="cursor: move;">Verisign manages .com/.net</text>
  <text x="293" y="79" class="sub" style="cursor: move;">ICANN accredits registrars</text>
  <text x="293" y="93" class="sub" style="cursor: move;">Stores delegation:</text>
  <text x="293" y="107" class="sub" style="cursor: move;">mycompany.com NS</text>
  <text x="293" y="119" class="sub" style="cursor: move;">→ ns1.registrar.com</text>

  <line x1="378" y1="82" x2="406" y2="82" class="con" marker-end="url(#drA)" style="cursor: move;"/>

  <!-- Step 3: Authoritative NS — rect height increased to contain all 8 records -->
  <text x="508" y="30" class="num" style="cursor: move;">3</text>
  <rect x="408" y="36" width="208" height="180" rx="7" class="ns" style="cursor: move;"/>
  <text x="512" y="54" class="lbl" style="cursor: move;">AUTH. NAME SERVER</text>
  <text x="512" y="68" class="sub" style="cursor: move;">Your DNS zone for mycompany.com</text>
  <line x1="416" y1="76" x2="608" y2="76" stroke="var(--svg-blue,rgba(99,179,237,.15))" stroke-width=".7" fill="none" style="cursor: move;"/>
  <text x="416" y="92" class="rec" style="cursor: move;">A</text>
  <text x="448" y="92" class="sub1" text-anchor="start" style="cursor: move;">mycompany.com → 45.33.32.156</text>
  <text x="416" y="108" class="rec" style="cursor: move;">CNAME</text>
  <text x="448" y="108" class="sub1" text-anchor="start" style="cursor: move;">www → mycompany.com</text>
  <text x="416" y="124" class="rec-g" style="cursor: move;">MX</text>
  <text x="448" y="124" class="sub1" text-anchor="start" style="cursor: move;">mycompany.com → mail.google.com</text>
  <text x="416" y="140" class="rec-r" style="cursor: move;">TXT</text>
  <text x="448" y="140" class="sub1" text-anchor="start" style="cursor: move;">v=spf1 include:google.com ~all</text>
  <text x="416" y="156" class="rec-r" style="cursor: move;">TXT</text>
  <text x="448" y="156" class="sub1" text-anchor="start" style="cursor: move;">_dmarc: v=DMARC1; p=quarantine</text>
  <text x="416" y="172" class="rec" style="cursor: move;">TXT</text>
  <text x="448" y="172" class="sub1" text-anchor="start" style="cursor: move;">_domainkey: (DKIM public key)</text>
  <text x="416" y="188" class="rec" style="cursor: move;">NS</text>
  <text x="448" y="188" class="sub1" text-anchor="start" style="cursor: move;">ns1.registrar.com</text>
  <text x="416" y="204" class="rec" style="cursor: move;">NS</text>
  <text x="448" y="204" class="sub1" text-anchor="start" style="cursor: move;">ns2.registrar.com</text>

  <!-- Web Server — to the right, vertically separate -->
  <text x="724" y="30" class="num" style="cursor: move;">4a</text>
  
  <text x="720" y="55" class="lbl" style="cursor: move;">🌐 WEB SERVER</text>
  <text x="720" y="68" class="sub" style="cursor: move;">45.33.32.156  port 80/443</text>
  <text x="720" y="81" class="sub" style="cursor: move;">nginx / Apache / AWS EC2</text>
  <text x="720" y="94" class="sub" style="cursor: move;">Hosts: HTML / CSS / JS / API</text>
  <text x="720" y="109" class="sub" style="cursor: move;">TLS cert: Let's Encrypt (free)</text>

  <!-- Arrow from NS to Web (A record) -->
  <line x1="615" y1="70" x2="636" y2="70" class="con-g" marker-end="url(#drG)" style="cursor: move;"/>
  <text x="630" y="64" class="sub" fill="var(--svg-green,#68d391)" style="cursor: move;">A rec</text>

  <!-- Mail Server — further down to avoid overlap -->
  <text x="724" y="134" class="num" style="cursor: move;">4b</text>
  <rect x="640" y="140" width="170" height="82" rx="7" class="mail" style="cursor: move;"/>
  <text x="720" y="159" class="lbl" style="cursor: move;">📧 MAIL SERVER</text>
  <text x="720" y="172" class="sub" style="cursor: move;">mail.google.com (G-Suite)</text>
  <text x="720" y="185" class="sub" style="cursor: move;">or Microsoft 365 / Zoho Mail</text>
  <text x="720" y="198" class="sub" style="cursor: move;">Receives @mycompany.com</text>
  <text x="720" y="211" class="sub" style="cursor: move;">Delivers to user inboxes</text>

  <!-- Arrow from NS to Mail (MX record) -->
  <line x1="615" y1="172" x2="636" y2="172" class="con-r" marker-end="url(#drR)" style="cursor: move;"/>
  <text x="630" y="166" class="sub" fill="var(--svg-red,#fc8181)" style="cursor: move;">MX rec</text>

  <!-- Bottom: Two info boxes — well separated, more height -->
  <rect x="6" y="216" width="400" height="258" rx="8" fill="var(--svg-fill2,rgba(246,173,85,.05))" stroke="var(--svg-amber,rgba(246,173,85,.2))" stroke-width="1" style="cursor: move;"/>
  <text x="206" y="234" class="hdr" fill="var(--svg-amber,#f6ad55)" style="cursor: move;">HOW TO REGISTER EACH</text>

  <text x="14" y="252" class="note" font-weight="700" fill="var(--svg-amber,#f6ad55)" style="cursor: move;">① Domain name:</text>
  <text x="14" y="266" class="note" style="cursor: move;">  Go to GoDaddy/Namecheap</text>
  <text x="14" y="280" class="note" style="cursor: move;">  Search mycompany.com → pay ~$12/yr</text>
  <text x="14" y="294" class="note" style="cursor: move;">  You now control the DNS zone</text>

  <text x="14" y="314" class="note" font-weight="700" fill="var(--svg-green,#68d391)" style="cursor: move;">② Website hosting:</text>
  <text x="14" y="328" class="note" style="cursor: move;">  Get a server: AWS EC2, Netlify, Vercel</text>
  <text x="14" y="342" class="note" style="cursor: move;">  Add A record: mycompany.com → server IP</text>
  <text x="14" y="356" class="note" style="cursor: move;">  Add CNAME: www → mycompany.com</text>
  <text x="14" y="370" class="note" style="cursor: move;">  Install TLS cert (Let's Encrypt = free)</text>

  <text x="14" y="390" class="note" font-weight="700" fill="var(--svg-red,#fc8181)" style="cursor: move;">③ Email domain (@mycompany.com):</text>
  <text x="14" y="404" class="note" style="cursor: move;">  Sign up for Google Workspace / M365 / Zoho</text>
  <text x="14" y="418" class="note" style="cursor: move;">  Provider gives you MX records to add to DNS</text>
  <text x="14" y="432" class="note" style="cursor: move;">  Add MX + SPF + DKIM + DMARC records</text>
  <text x="14" y="446" class="note" style="cursor: move;">  person@mycompany.com now delivers to inbox</text>
  <text x="14" y="466" class="note" style="cursor: move;">  DNS propagation: 5 min – 48 hrs (TTL dependent)</text>

  <rect x="414" y="216" width="400" height="258" rx="8" fill="var(--svg-fill2,rgba(99,179,237,.05))" stroke="var(--svg-border,rgba(99,179,237,.18))" stroke-width="1" style="cursor: move;"/>
  <text x="614" y="234" class="hdr" style="cursor: move;">WHAT HAPPENS AFTER REGISTRATION</text>

  <text x="422" y="252" class="note" font-weight="700" fill="var(--svg-blue,#63b3ed)" style="cursor: move;">User visits https://mycompany.com:</text>
  <text x="422" y="266" class="note" style="cursor: move;">1. OS DNS cache miss → recursive resolver</text>
  <text x="422" y="280" class="note" style="cursor: move;">2. Resolver → root → .com TLD → Auth NS</text>
  <text x="422" y="294" class="note" style="cursor: move;">3. Auth NS returns: A = 45.33.32.156</text>
  <text x="422" y="308" class="note" style="cursor: move;">4. Browser TCP connects to 45.33.32.156:443</text>
  <text x="422" y="322" class="note" style="cursor: move;">5. TLS handshake + certificate verified</text>
  <text x="422" y="336" class="note" style="cursor: move;">6. HTTPS GET / → HTML returned → page renders</text>

  <text x="422" y="356" class="note" font-weight="700" fill="var(--svg-red,#fc8181)" style="cursor: move;">User emails person@mycompany.com:</text>
  <text x="422" y="370" class="note" style="cursor: move;">1. Sender's MTA does DNS MX lookup</text>
  <text x="422" y="384" class="note" style="cursor: move;">2. MX record = mail.google.com (priority 10)</text>
  <text x="422" y="398" class="note" style="cursor: move;">3. SMTP to mail.google.com:25 (STARTTLS)</text>
  <text x="422" y="412" class="note" style="cursor: move;">4. Receiving MTA checks SPF + DKIM + DMARC</text>
  <text x="422" y="426" class="note" style="cursor: move;">5. If all pass → delivered to inbox ✓</text>
  <text x="422" y="440" class="note" style="cursor: move;">6. If any fail → spam folder or rejected ✗</text>
  <text x="422" y="460" class="note" style="cursor: move;">Total: ~1–5 seconds end to end</text>
<rect x="640" y="36" width="170" height="82" rx="7" class="web" style="cursor: move;"/>

</svg>