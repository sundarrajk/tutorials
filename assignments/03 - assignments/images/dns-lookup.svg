<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <style>
    .client  {fill:var(--svg-fill1,rgba(99,179,237,.2));stroke:var(--svg-blue,#63b3ed);stroke-width:1.4;}
    .resolver{fill:var(--svg-fill1,rgba(246,173,85,.2));stroke:var(--svg-amber,#f6ad55);stroke-width:1.4;}
    .root    {fill:var(--svg-fill1,rgba(252,129,129,.2));stroke:var(--svg-red,#fc8181);stroke-width:1.4;}
    .tld     {fill:var(--svg-fill1,rgba(183,148,244,.2));stroke:var(--svg-purple,#b794f4);stroke-width:1.4;}
    .auth    {fill:var(--svg-fill1,rgba(104,211,145,.2));stroke:var(--svg-green,#68d391);stroke-width:1.4;}
    .cache   {fill:var(--svg-fill2,rgba(0,229,255,.12));stroke:var(--svg-cyan,#00e5ff);stroke-width:1.2;stroke-dasharray:4,3;}
    .lbl {fill:var(--svg-text1,#d0e4f8);font-family:monospace;font-size:8.5px;font-weight:700;text-anchor:middle;}
    .sub {fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:7.5px;text-anchor:middle;}
    .q   {fill:var(--svg-blue,#63b3ed);font-family:monospace;font-size:8px;text-anchor:middle;font-weight:700;}
    .r   {fill:var(--svg-green,#68d391);font-family:monospace;font-size:8px;text-anchor:middle;font-weight:700;}
    .note{fill:var(--svg-text2,#6a9ab8);font-family:monospace;font-size:8px;}
    .good{fill:var(--svg-green,rgba(104,211,145,.8));font-family:monospace;font-size:8px;}
    .arr-b{fill:var(--svg-blue,rgba(99,179,237,.6));}
    .arr-g{fill:var(--svg-green,rgba(104,211,145,.6));}
    .hdr {fill:var(--svg-text2,rgba(99,179,237,.55));font-family:monospace;font-size:9.5px;letter-spacing:1px;font-weight:700;text-anchor:middle;}
    @keyframes dnsStep {0%,100%{opacity:.3;}14%{opacity:1;}}
    .d1{animation:dnsStep 9s 0.0s infinite;}
    .d2{animation:dnsStep 9s 1.0s infinite;}
    .d3{animation:dnsStep 9s 2.0s infinite;}
    .d4{animation:dnsStep 9s 3.0s infinite;}
    .d5{animation:dnsStep 9s 4.0s infinite;}
    .d6{animation:dnsStep 9s 5.0s infinite;}
    .d7{animation:dnsStep 9s 6.0s infinite;}
    .d8{animation:dnsStep 9s 7.0s infinite;}
    .d9{animation:dnsStep 9s 8.0s infinite;}
  </style>
  <defs>
    <marker id="dnB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" class="arr-b"/></marker>
    <marker id="dnG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" class="arr-g"/></marker>
  </defs>

  <text x="410" y="14" class="hdr">DNS RECURSIVE RESOLUTION — LOOKING UP google.com</text>

  <!-- 5 nodes across the top — taller boxes -->
  <rect x="10"  y="26" width="108" height="56" rx="7" class="client"/>
  <text x="64"  y="45" class="lbl">YOUR BROWSER</text>
  <text x="64"  y="57" class="sub">192.168.1.5</text>
  <text x="64"  y="69" class="sub">types: google.com</text>

  <rect x="158" y="26" width="120" height="56" rx="7" class="resolver"/>
  <text x="218" y="42" class="lbl">RECURSIVE</text>
  <text x="218" y="54" class="lbl">RESOLVER</text>
  <text x="218" y="66" class="sub">8.8.8.8 (Google DNS)</text>
  <text x="218" y="76" class="sub">or ISP's resolver</text>

  <rect x="324" y="26" width="112" height="56" rx="7" class="root"/>
  <text x="380" y="42" class="lbl">ROOT NAME</text>
  <text x="380" y="54" class="lbl">SERVER</text>
  <text x="380" y="66" class="sub">13 clusters globally</text>
  <text x="380" y="76" class="sub">a.root-servers.net</text>

  <rect x="492" y="26" width="122" height="56" rx="7" class="tld"/>
  <text x="553" y="42" class="lbl">TLD NAME SERVER</text>
  <text x="553" y="54" class="lbl">.com zone</text>
  <text x="553" y="66" class="sub">a.gtld-servers.net</text>
  <text x="553" y="76" class="sub">Verisign runs .com</text>

  <rect x="674" y="26" width="140" height="56" rx="7" class="auth"/>
  <text x="744" y="42" class="lbl">AUTHORITATIVE NS</text>
  <text x="744" y="54" class="lbl">google.com zone</text>
  <text x="744" y="66" class="sub">ns1.google.com</text>
  <text x="744" y="76" class="sub">Has the real IP</text>

  <!-- Step arrows — spread vertically with room between each -->
  <g class="d1">
    <line x1="120" y1="54" x2="156" y2="54" stroke="var(--svg-blue,rgba(99,179,237,.7))" stroke-width="1.5" fill="none" marker-end="url(#dnB)"/>
    <text x="138" y="48" class="q">①</text>
    <text x="138" y="59" class="q">google.com?</text>
  </g>

  <g class="d2">
    <line x1="280" y1="82" x2="322" y2="96" stroke="var(--svg-blue,rgba(99,179,237,.7))" stroke-width="1.5" fill="none" marker-end="url(#dnB)"/>
    <text x="300" y="82" class="q">② Cache miss → ask root</text>
  </g>

  <g class="d3">
    <line x1="322" y1="100" x2="280" y2="116" stroke="var(--svg-green,rgba(104,211,145,.7))" stroke-width="1.5" fill="none" marker-end="url(#dnG)"/>
    <text x="300" y="109" class="r">③ Don't know. Ask .com: a.gtld-servers.net</text>
  </g>

  <g class="d4">
    <line x1="280" y1="128" x2="490" y2="128" stroke="var(--svg-blue,rgba(99,179,237,.7))" stroke-width="1.5" fill="none" marker-end="url(#dnB)"/>
    <text x="385" y="122" class="q">④ Who is google.com? (asking TLD)</text>
  </g>

  <g class="d5">
    <line x1="490" y1="144" x2="280" y2="158" stroke="var(--svg-green,rgba(104,211,145,.7))" stroke-width="1.5" fill="none" marker-end="url(#dnG)"/>
    <text x="385" y="153" class="r">⑤ Don't know. Ask: ns1.google.com</text>
  </g>

  <g class="d6">
    <line x1="280" y1="170" x2="672" y2="170" stroke="var(--svg-blue,rgba(99,179,237,.7))" stroke-width="1.5" fill="none" marker-end="url(#dnB)"/>
    <text x="476" y="164" class="q">⑥ What is the IP for google.com?</text>
  </g>

  <g class="d7">
    <line x1="672" y1="184" x2="280" y2="200" stroke="var(--svg-green,rgba(104,211,145,.7))" stroke-width="2" fill="none" marker-end="url(#dnG)"/>
    <text x="476" y="192" class="r">⑦ google.com → 142.250.189.206  TTL: 300s</text>
  </g>

  <!-- Cache box — resolver now caches it -->
  <rect x="160" y="206" width="118" height="22" rx="4" class="cache"/>
  <text x="219" y="220" class="sub" fill="var(--svg-cyan,#00e5ff)" font-weight="700">Cache: google.com → 142... (300s)</text>

  <g class="d8">
    <line x1="156" y1="236" x2="118" y2="236" stroke="var(--svg-green,rgba(104,211,145,.7))" stroke-width="2" fill="none" marker-end="url(#dnG)"/>
    <text x="137" y="230" class="r">⑧ 142.250.189.206</text>
  </g>

  <g class="d9">
    <rect x="430" y="228" width="130" height="28" rx="5" fill="var(--svg-fill1,rgba(104,211,145,.2))" stroke="var(--svg-green,#68d391)" stroke-width="1.2"/>
    <text x="495" y="243" class="lbl">142.250.189.206</text>
    <text x="495" y="252" class="sub">Google Server</text>
    <line x1="118" y1="242" x2="428" y2="242" stroke="var(--svg-blue,rgba(99,179,237,.9))" stroke-width="2" fill="none" marker-end="url(#dnB)"/>
    <text x="274" y="236" class="q">⑨ TCP connect → HTTPS</text>
  </g>

  <!-- Info boxes — two columns, well separated -->
  <rect x="10"  y="274" width="390" height="140" rx="7" fill="var(--svg-fill2,rgba(246,173,85,.05))" stroke="var(--svg-amber,rgba(246,173,85,.2))" stroke-width="1"/>
  <text x="205" y="292" class="hdr" fill="var(--svg-amber,#f6ad55)">KEY DNS RECORD TYPES</text>
  <text x="18"  y="310" class="note"><tspan font-weight="700" fill="var(--svg-blue,#63b3ed)">A     </tspan>hostname → IPv4 (google.com → 142.250.189.206)</text>
  <text x="18"  y="326" class="note"><tspan font-weight="700" fill="var(--svg-blue,#63b3ed)">AAAA  </tspan>hostname → IPv6 address</text>
  <text x="18"  y="342" class="note"><tspan font-weight="700" fill="var(--svg-green,#68d391)">MX    </tspan>mail exchanger for domain (used by SMTP)</text>
  <text x="18"  y="358" class="note"><tspan font-weight="700" fill="var(--svg-purple,#b794f4)">CNAME </tspan>alias → canonical name (www → example.com)</text>
  <text x="18"  y="374" class="note"><tspan font-weight="700" fill="var(--svg-amber,#f6ad55)">TXT   </tspan>arbitrary text: SPF, DKIM, domain verification</text>
  <text x="18"  y="390" class="note"><tspan font-weight="700" fill="var(--svg-red,#fc8181)">NS    </tspan>which nameservers are authoritative for this zone</text>

  <rect x="412" y="274" width="400" height="140" rx="7" fill="var(--svg-fill2,rgba(104,211,145,.05))" stroke="var(--svg-green,rgba(104,211,145,.2))" stroke-width="1"/>
  <text x="612" y="292" class="hdr" fill="var(--svg-green,#68d391)">CACHING &amp; TTL</text>
  <text x="420" y="310" class="note">Every DNS response carries a TTL (Time-To-Live) in seconds.</text>
  <text x="420" y="326" class="note">Recursive resolver caches the answer until TTL expires.</text>
  <text x="420" y="342" class="note">Your OS and browser also maintain DNS caches.</text>
  <text x="420" y="358" class="note">Low TTL (60s): fast failover when IP changes.</text>
  <text x="420" y="374" class="note">High TTL (86400s): fewer lookups, faster browsing.</text>
  <text x="420" y="390" class="note">Subsequent lookups skip steps 2–7 — answered from cache.</text>
  <text x="420" y="406" class="note">This is why DNS changes take up to 48h to propagate globally.</text>
</svg>
