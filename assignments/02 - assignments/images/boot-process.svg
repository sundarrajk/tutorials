<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260">
  <style>
    .b1  { fill:var(--svg-fill1,rgba(252,129,129,.2));   stroke:var(--svg-red,#fc8181);    stroke-width:1.3; }
    .b2  { fill:var(--svg-fill1,rgba(246,173,85,.2));    stroke:var(--svg-amber,#f6ad55);  stroke-width:1.3; }
    .b3  { fill:var(--svg-fill1,rgba(183,148,244,.2));   stroke:var(--svg-purple,#b794f4); stroke-width:1.3; }
    .b4  { fill:var(--svg-fill1,rgba(104,211,145,.2));   stroke:var(--svg-green,#68d391);  stroke-width:1.3; }
    .b5  { fill:var(--svg-fill1,rgba(99,179,237,.2));    stroke:var(--svg-blue,#63b3ed);   stroke-width:1.3; }
    .b6  { fill:var(--svg-fill1,rgba(104,211,145,.3));   stroke:var(--svg-green,#68d391);  stroke-width:1.8; }
    .arr  { fill:var(--svg-text2,rgba(99,179,237,.55)); }
    .con  { stroke:var(--svg-text2,rgba(99,179,237,.4)); fill:none; stroke-width:1.5; }
    .h1   { fill:var(--svg-red,#fc8181);    font-family:monospace; font-size:8.5px; font-weight:700; text-anchor:middle; }
    .h2   { fill:var(--svg-amber,#f6ad55);  font-family:monospace; font-size:8.5px; font-weight:700; text-anchor:middle; }
    .h3   { fill:var(--svg-purple,#b794f4); font-family:monospace; font-size:8.5px; font-weight:700; text-anchor:middle; }
    .h4   { fill:var(--svg-green,#68d391);  font-family:monospace; font-size:8.5px; font-weight:700; text-anchor:middle; }
    .h5   { fill:var(--svg-blue,#63b3ed);   font-family:monospace; font-size:8.5px; font-weight:700; text-anchor:middle; }
    .h6   { fill:var(--svg-green,#68d391);  font-family:monospace; font-size:9px; font-weight:700; text-anchor:middle; }
    .sub  { fill:var(--svg-text2,#6a9ab8); font-family:monospace; font-size:7px; text-anchor:middle; }
    .note { fill:var(--svg-text2,#6a9ab8); font-family:monospace; font-size:8px; }
    .good { fill:var(--svg-green,rgba(104,211,145,.8)); font-family:monospace; font-size:8px; }
    .num  { fill:var(--svg-text2,rgba(99,179,237,.5)); font-family:monospace; font-size:22px; font-weight:700; text-anchor:middle; }

    @keyframes bootStep {
      0%,100% { opacity:.4; }
      16%     { opacity:1; }
    }
    .s1 { animation: bootStep 7s 0.0s infinite; }
    .s2 { animation: bootStep 7s 1.0s infinite; }
    .s3 { animation: bootStep 7s 2.0s infinite; }
    .s4 { animation: bootStep 7s 3.0s infinite; }
    .s5 { animation: bootStep 7s 4.0s infinite; }
    .s6 { animation: bootStep 7s 5.0s infinite; }
  </style>
  <defs>
    <marker id="bA" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" class="arr"/>
    </marker>
  </defs>

  <!-- Step boxes side by side with arrows -->
  <!-- Step 1: Power On -->
  <rect x="6"   y="40" width="114" height="106" rx="7" class="b1 s1"/>
  <text x="8"   y="33" class="num" fill="var(--svg-red,rgba(252,129,129,.5))">1</text>
  <text x="63"  y="58" class="h1">POWER ON</text>
  <text x="63"  y="70" class="sub">CPU starts at</text>
  <text x="63"  y="80" class="sub">fixed reset vector</text>
  <text x="63"  y="90" class="sub">0xFFFFFFF0 (x86)</text>
  <text x="63"  y="103" class="sub">BIOS/UEFI chip</text>
  <text x="63"  y="113" class="sub">mapped here</text>
  <text x="63"  y="126" class="sub">RAM not ready yet</text>
  <text x="63"  y="137" class="sub">CPU runs from ROM</text>
  <line x1="122" y1="93" x2="136" y2="93" class="con" marker-end="url(#bA)"/>

  <!-- Step 2: POST -->
  <rect x="138" y="40" width="114" height="106" rx="7" class="b2 s2"/>
  <text x="140" y="33" class="num" fill="var(--svg-amber,rgba(246,173,85,.5))">2</text>
  <text x="195" y="58" class="h2">POST</text>
  <text x="195" y="70" class="sub">Power-On Self Test</text>
  <text x="195" y="82" class="sub">Test RAM DIMMs</text>
  <text x="195" y="92" class="sub">Init CPU, chipset</text>
  <text x="195" y="102" class="sub">Enumerate PCI/PCIe</text>
  <text x="195" y="112" class="sub">Check storage</text>
  <text x="195" y="122" class="sub">controllers (NVMe)</text>
  <text x="195" y="135" class="sub">Beep codes on fail</text>
  <line x1="254" y1="93" x2="268" y2="93" class="con" marker-end="url(#bA)"/>

  <!-- Step 3: BIOS vs UEFI -->
  <rect x="270" y="40" width="114" height="106" rx="7" class="b3 s3"/>
  <text x="272" y="33" class="num" fill="var(--svg-purple,rgba(183,148,244,.5))">3</text>
  <text x="327" y="56" class="h3">BIOS / UEFI</text>
  <text x="327" y="68" class="sub">BIOS (legacy):</text>
  <text x="327" y="78" class="sub">Reads MBR sector 0</text>
  <text x="327" y="88" class="sub">446 byte bootloader</text>
  <text x="327" y="100" class="sub">UEFI (modern):</text>
  <text x="327" y="110" class="sub">GPT partition table</text>
  <text x="327" y="120" class="sub">Reads EFI partition</text>
  <text x="327" y="130" class="sub">bootmgfw.efi (Win)</text>
  <text x="327" y="142" class="sub">Secure Boot verify</text>
  <line x1="386" y1="93" x2="400" y2="93" class="con" marker-end="url(#bA)"/>

  <!-- Step 4: Bootloader -->
  <rect x="402" y="40" width="114" height="106" rx="7" class="b4 s4"/>
  <text x="404" y="33" class="num" fill="var(--svg-green,rgba(104,211,145,.5))">4</text>
  <text x="459" y="56" class="h4">BOOTLOADER</text>
  <text x="459" y="68" class="sub">Windows Boot Mgr</text>
  <text x="459" y="78" class="sub">or GRUB (Linux)</text>
  <text x="459" y="90" class="sub">Loads kernel image</text>
  <text x="459" y="100" class="sub">from disk into RAM</text>
  <text x="459" y="110" class="sub">Sets up page tables</text>
  <text x="459" y="120" class="sub">Switches CPU to</text>
  <text x="459" y="130" class="sub">64-bit protected</text>
  <text x="459" y="142" class="sub">mode</text>
  <line x1="518" y1="93" x2="532" y2="93" class="con" marker-end="url(#bA)"/>

  <!-- Step 5: Kernel init -->
  <rect x="534" y="40" width="114" height="106" rx="7" class="b5 s5"/>
  <text x="536" y="33" class="num" fill="var(--svg-blue,rgba(99,179,237,.5))">5</text>
  <text x="591" y="56" class="h5">KERNEL INIT</text>
  <text x="591" y="68" class="sub">ntoskrnl.exe (Win)</text>
  <text x="591" y="78" class="sub">vmlinuz (Linux)</text>
  <text x="591" y="88" class="sub">Init memory mgmt</text>
  <text x="591" y="98" class="sub">Load drivers from</text>
  <text x="591" y="108" class="sub">registry/initramfs</text>
  <text x="591" y="118" class="sub">Start scheduler</text>
  <text x="591" y="128" class="sub">Mount root filesystem</text>
  <text x="591" y="140" class="sub">Start PID 1</text>
  <line x1="650" y1="93" x2="664" y2="93" class="con" marker-end="url(#bA)"/>

  <!-- Step 6: OS Running -->
  <rect x="666" y="40" width="148" height="106" rx="7" class="b6 s6"/>
  <text x="668" y="33" class="num" fill="var(--svg-green,rgba(104,211,145,.5))">6</text>
  <text x="740" y="56" class="h6">OS RUNNING</text>
  <text x="740" y="68" class="sub">Windows: smss.exe</text>
  <text x="740" y="78" class="sub">→ winlogon → login</text>
  <text x="740" y="88" class="sub">Linux: systemd / PID1</text>
  <text x="740" y="98" class="sub">→ targets → services</text>
  <text x="740" y="110" class="sub">→ display manager</text>
  <text x="740" y="122" class="sub">User services start</text>
  <text x="740" y="134" class="sub">Desktop appears</text>
  <text x="740" y="146" class="sub">~10–30 sec total</text>

  <!-- BIOS vs UEFI comparison -->
  <rect x="6" y="160" width="400" height="96" rx="7" fill="var(--svg-fill2,rgba(246,173,85,.06))" stroke="var(--svg-amber,rgba(246,173,85,.25))" stroke-width="1"/>
  <text x="206" y="175" class="h2" text-anchor="middle">BIOS vs UEFI</text>
  <text x="14"  y="193" class="note" font-weight="700" fill="var(--svg-red,rgba(252,129,129,.8))">BIOS (1975–2010s)</text>
  <text x="14"  y="207" class="note">• 16-bit real mode · MBR · max 2 TB disk · no GUI · no mouse</text>
  <text x="14"  y="221" class="note">• 446-byte bootloader in sector 0 · no Secure Boot · slow init</text>
  <text x="14"  y="238" class="note" font-weight="700" fill="var(--svg-green,rgba(104,211,145,.8))">UEFI (2006–present)</text>
  <text x="14"  y="252" class="note">• 64-bit · GPT partitions · 9 ZB disk · built-in GUI · mouse · network</text>

  <rect x="420" y="160" width="394" height="96" rx="7" fill="var(--svg-fill2,rgba(104,211,145,.06))" stroke="var(--svg-green,rgba(104,211,145,.25))" stroke-width="1"/>
  <text x="617" y="175" class="h4" text-anchor="middle">KEY CONCEPTS</text>
  <text x="428" y="193" class="note">• Secure Boot: UEFI verifies bootloader signature — prevents rootkits</text>
  <text x="428" y="207" class="note">• Fast Boot: UEFI skips POST hardware tests on trusted restarts</text>
  <text x="428" y="221" class="note">• TPM: Trusted Platform Module stores encryption keys (BitLocker)</text>
  <text x="428" y="238" class="note">• All modern PCs ship with UEFI. BIOS emulation mode (CSM) still exists.</text>
  <text x="428" y="252" class="note">• Windows 11 requires UEFI + Secure Boot + TPM 2.0</text>
</svg>
