<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200">
  <style>
    .bg   { fill:none; }
    /* cause column */
    .cause{ fill:var(--svg-fill2,rgba(252,129,129,.08)); stroke:var(--svg-red,#fc8181); stroke-width:1.3; }
    .effect{fill:var(--svg-fill2,rgba(104,211,145,.08)); stroke:var(--svg-green,#68d391); stroke-width:1.3; }
    /* centre */
    .spark{ fill:var(--svg-fill1,rgba(246,173,85,.2)); stroke:var(--svg-amber,#f6ad55); stroke-width:2; }
    /* text */
    .ch   { fill:var(--svg-red,#fc8181); font-family:monospace; font-size:9px; font-weight:700; text-anchor:middle; letter-spacing:.5px; }
    .eh   { fill:var(--svg-green,#68d391); font-family:monospace; font-size:9px; font-weight:700; text-anchor:middle; letter-spacing:.5px; }
    .ci   { fill:var(--svg-red,rgba(252,129,129,.8)); font-family:monospace; font-size:9px; text-anchor:middle; }
    .ei   { fill:var(--svg-green,rgba(104,211,145,.8)); font-family:monospace; font-size:9px; text-anchor:middle; }
    .sh   { fill:var(--svg-amber,#f6ad55); font-family:sans-serif; font-size:11px; font-weight:700; text-anchor:middle; }
    .ss   { fill:var(--svg-amber,rgba(246,173,85,.7)); font-family:monospace; font-size:8px; text-anchor:middle; }
    .arr  { fill:var(--svg-amber,rgba(246,173,85,.7)); }
    .con  { stroke:var(--svg-amber,rgba(246,173,85,.45)); fill:none; stroke-width:1.3; }
  </style>
  <defs>
    <marker id="spk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" class="arr"/>
    </marker>
  </defs>

  <!-- LEFT: causes -->
  <rect x="6"   y="6"  width="220" height="188" rx="8" class="cause"/>
  <text x="116" y="24" class="ch">WHAT BROKE THE OLD MODEL</text>
  <line x1="20" y1="30" x2="212" y2="30" stroke="var(--svg-red,rgba(252,129,129,.2))" stroke-width=".8" fill="none"/>
  <text x="116" y="46" class="ci">🌐 Millions of retail users</text>
  <text x="116" y="60" class="ci">📈 10–20× load spikes overnight</text>
  <text x="116" y="74" class="ci">🛒 Black Friday / viral events</text>
  <text x="116" y="88" class="ci">Procurement = months wait</text>
  <text x="116" y="102" class="ci">Deploy = days of downtime</text>
  <text x="116" y="116" class="ci">Apps hard-coded to static IPs</text>
  <text x="116" y="130" class="ci">One binary → scale everything</text>
  <text x="116" y="144" class="ci">Release every 6–12 months</text>
  <text x="116" y="158" class="ci">5–15% server utilisation</text>
  <text x="116" y="172" class="ci">One crash → total outage</text>
  <text x="116" y="186" class="ci">85% idle at off-peak</text>

  <!-- CENTRE: spark -->
  <rect x="248" y="62" width="142" height="76" rx="10" class="spark"/>
  <text x="319" y="86"  class="sh">THE INTERNET</text>
  <text x="319" y="100" class="sh">CHANGED THE</text>
  <text x="319" y="114" class="sh">RULES</text>
  <text x="319" y="128" class="ss">~1995–2010</text>

  <!-- arrows -->
  <line x1="228" y1="100" x2="246" y2="100" class="con" marker-end="url(#spk)"/>
  <line x1="392" y1="100" x2="410" y2="100" class="con" marker-end="url(#spk)"/>

  <!-- RIGHT: effects / solutions -->
  <rect x="412" y="6"  width="340" height="188" rx="8" class="effect"/>
  <text x="582" y="24" class="eh">WHAT THE INDUSTRY INVENTED</text>
  <line x1="424" y1="30" x2="740" y2="30" stroke="var(--svg-green,rgba(104,211,145,.2))" stroke-width=".8" fill="none"/>
  <text x="582" y="46" class="ei">⚡ Elastic compute (AWS EC2 2006)</text>
  <text x="582" y="60" class="ei">💵 Pay-per-minute, scale to zero</text>
  <text x="582" y="74" class="ei">🖥  Virtual Machines → 70%+ utilisation</text>
  <text x="582" y="88" class="ei">📦 Containers → deploy in seconds</text>
  <text x="582" y="102" class="ei">☸  Kubernetes → self-healing clusters</text>
  <text x="582" y="116" class="ei">🔀 Microservices → scale per domain</text>
  <text x="582" y="130" class="ei">📐 12-Factor → cloud-native apps</text>
  <text x="582" y="144" class="ei">🚀 CI/CD → deploy 100s × per day</text>
  <text x="582" y="158" class="ei">🔍 Observability → metrics+traces+logs</text>
  <text x="582" y="172" class="ei">🌍 3 providers → 200+ services each</text>
  <text x="582" y="186" class="ei">🏗  IaC → infra as code, version-controlled</text>
</svg>
