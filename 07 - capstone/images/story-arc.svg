<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200">
  <style>
    .bg   { fill: none; }
    /* Act boxes */
    .a1   { fill: var(--svg-fill1,rgba(99,179,237,.12)); stroke: var(--svg-blue,#63b3ed); stroke-width:1.5; }
    .a2   { fill: var(--svg-fill1,rgba(183,148,244,.12)); stroke: var(--svg-purple,#b794f4); stroke-width:1.5; }
    .a3   { fill: var(--svg-fill1,rgba(246,173,85,.12)); stroke: var(--svg-amber,#f6ad55); stroke-width:1.5; }
    .a4   { fill: var(--svg-fill1,rgba(104,211,145,.12)); stroke: var(--svg-green,#68d391); stroke-width:1.5; }
    /* arrows */
    .arr  { fill: var(--svg-text2,#6a9ab8); }
    .con  { stroke: var(--svg-text2,#6a9ab8); fill:none; stroke-width:1.5; }
    /* labels */
    .num  { font-family: 'Playfair Display',serif; font-weight:900; font-size:26px; }
    .n1   { fill: var(--svg-blue,#63b3ed); }
    .n2   { fill: var(--svg-purple,#b794f4); }
    .n3   { fill: var(--svg-amber,#f6ad55); }
    .n4   { fill: var(--svg-green,#68d391); }
    .ttl  { font-family: sans-serif; font-size:11px; font-weight:700; }
    .t1   { fill: var(--svg-blue,#63b3ed); }
    .t2   { fill: var(--svg-purple,#b794f4); }
    .t3   { fill: var(--svg-amber,#f6ad55); }
    .t4   { fill: var(--svg-green,#68d391); }
    .sub  { fill: var(--svg-text2,#6a9ab8); font-family: monospace; font-size:9px; }
    .kw   { fill: var(--svg-text1,#d0e4f8); font-family: monospace; font-size:9px; font-weight:700; }
    .div  { stroke: var(--svg-text2,rgba(99,179,237,.15)); fill:none; }
    .glue { fill: var(--svg-text2,#5a7a94); font-family: monospace; font-size:8px; text-anchor:middle; }
  </style>
  <defs>
    <marker id="cA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" class="arr"/>
    </marker>
  </defs>

  <!-- ── ACT 1: IT History ── -->
  <rect x="8"   y="8" width="180" height="184" rx="10" class="a1"/>
  <text x="96"  y="38" class="num n1" text-anchor="middle">1</text>
  <text x="96"  y="55" class="ttl t1" text-anchor="middle">IT HISTORY</text>
  <line x1="20" y1="63" x2="176" y2="63" class="div" stroke-width=".8"/>
  <text x="96"  y="78" class="sub" text-anchor="middle">1950s–2006</text>
  <text x="96"  y="93" class="kw" text-anchor="middle">Punch cards → Mainframes</text>
  <text x="96"  y="107" class="kw" text-anchor="middle">PCs → Client-Server → Web</text>
  <text x="96"  y="121" class="kw" text-anchor="middle">Internet Giants arrive</text>
  <text x="96"  y="135" class="kw" text-anchor="middle">Amazon / Google / Netflix</text>
  <text x="96"  y="155" class="sub" text-anchor="middle">The question that started it all:</text>
  <text x="96"  y="168" class="sub" text-anchor="middle">why own idle servers?</text>
  <text x="96"  y="181" class="sub" text-anchor="middle">CAPEX → OPEX</text>

  <!-- arrow 1→2 -->
  <line x1="193" y1="100" x2="213" y2="100" class="con" marker-end="url(#cA)"/>
  <text x="203" y="92" class="glue">drove</text>

  <!-- ── ACT 2: CPU & VMs ── -->
  <rect x="217" y="8" width="180" height="184" rx="10" class="a2"/>
  <text x="307" y="38" class="num n2" text-anchor="middle">2</text>
  <text x="307" y="55" class="ttl t2" text-anchor="middle">CPU &amp; VIRTUAL MACHINES</text>
  <line x1="229" y1="63" x2="385" y2="63" class="div" stroke-width=".8"/>
  <text x="307" y="78" class="sub" text-anchor="middle">1965–2010</text>
  <text x="307" y="93" class="kw" text-anchor="middle">Moore's Law × 58M</text>
  <text x="307" y="107" class="kw" text-anchor="middle">Thermal wall → multi-core</text>
  <text x="307" y="121" class="kw" text-anchor="middle">5–15% server utilisation</text>
  <text x="307" y="135" class="kw" text-anchor="middle">VMs fix it: 5% → 70%+</text>
  <text x="307" y="155" class="sub" text-anchor="middle">Hardware foundation that</text>
  <text x="307" y="168" class="sub" text-anchor="middle">made the cloud physically</text>
  <text x="307" y="181" class="sub" text-anchor="middle">possible</text>

  <!-- arrow 2→3 -->
  <line x1="402" y1="100" x2="422" y2="100" class="con" marker-end="url(#cA)"/>
  <text x="412" y="92" class="glue">exposed</text>

  <!-- ── ACT 3: Cloud Background ── -->
  <rect x="426" y="8" width="190" height="184" rx="10" class="a3"/>
  <text x="521" y="38" class="num n3" text-anchor="middle">3</text>
  <text x="521" y="55" class="ttl t3" text-anchor="middle">CLOUD BACKGROUND</text>
  <line x1="438" y1="63" x2="604" y2="63" class="div" stroke-width=".8"/>
  <text x="521" y="78" class="sub" text-anchor="middle">On-prem pain · 2000s–2010s</text>
  <text x="521" y="93" class="kw" text-anchor="middle">Static IPs, hard-coded configs</text>
  <text x="521" y="107" class="kw" text-anchor="middle">Procurement: months of wait</text>
  <text x="521" y="121" class="kw" text-anchor="middle">Deployment: days of risk</text>
  <text x="521" y="135" class="kw" text-anchor="middle">Lift-and-shift doesn't work</text>
  <text x="521" y="155" class="sub" text-anchor="middle">Cloud solves provisioning</text>
  <text x="521" y="168" class="sub" text-anchor="middle">but apps still must be</text>
  <text x="521" y="181" class="sub" text-anchor="middle">rebuilt to exploit it</text>

  <!-- arrow 3→4 -->
  <line x1="621" y1="100" x2="641" y2="100" class="con" marker-end="url(#cA)"/>
  <text x="631" y="92" class="glue">forced</text>

  <!-- ── ACT 4: Monolith → Microservices ── -->
  <rect x="645" y="8" width="207" height="184" rx="10" class="a4"/>
  <text x="748" y="38" class="num n4" text-anchor="middle">4</text>
  <text x="748" y="55" class="ttl t4" text-anchor="middle">MONOLITH → MICROSERVICES</text>
  <line x1="657" y1="63" x2="840" y2="63" class="div" stroke-width=".8"/>
  <text x="748" y="78" class="sub" text-anchor="middle">Cloud-native design · 2010s+</text>
  <text x="748" y="93" class="kw" text-anchor="middle">Bounded contexts / DDD</text>
  <text x="748" y="107" class="kw" text-anchor="middle">The 12-Factor App</text>
  <text x="748" y="121" class="kw" text-anchor="middle">Docker → images as releases</text>
  <text x="748" y="135" class="kw" text-anchor="middle">Kubernetes → orchestration</text>
  <text x="748" y="155" class="sub" text-anchor="middle">Observability: metrics,</text>
  <text x="748" y="168" class="sub" text-anchor="middle">traces, logs replace</text>
  <text x="748" y="181" class="sub" text-anchor="middle">a single debugger</text>
</svg>
